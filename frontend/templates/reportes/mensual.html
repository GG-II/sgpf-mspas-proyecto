<!-- ===== SISTEMA DE REPORTES V2.0 - BASE ===== -->

<div class="max-w-7xl mx-auto p-4 space-y-6">
  <!-- Header Principal -->
  <div class="bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl shadow-xl p-8">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center backdrop-blur-sm">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-3xl font-bold">Sistema de Reportes</h1>
          <p class="text-purple-100 text-lg mt-1">Consultas, análisis y exportaciones</p>
        </div>
      </div>
      
      <!-- Selector de Año Global -->
      <div class="flex items-center gap-3">
        <label class="text-white font-semibold text-lg">Año:</label>
        <select id="reporte-anio-global" class="px-5 py-3 bg-white bg-opacity-20 text-white font-bold text-lg rounded-xl border-2 border-white border-opacity-30 backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 cursor-pointer transition-all hover:bg-opacity-30">
          <option value="">Cargando años...</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Navegación por Pestañas -->
  <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    <div class="border-b border-gray-200 bg-gradient-to-r from-gray-50 to-gray-100">
      <nav class="flex -mb-px overflow-x-auto" id="tabs-reportes">
        <button data-tab="general" class="tab-reporte px-6 py-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap text-purple-600 border-purple-600">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            Proyección General
          </div>
        </button>
        
        <button data-tab="metodo" class="tab-reporte px-6 py-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            Por Método
          </div>
        </button>
        
        <button data-tab="territorio" class="tab-reporte px-6 py-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Por Territorio
          </div>
        </button>
        
        <button data-tab="fichas" class="tab-reporte px-6 py-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Fichas de Usuarias
          </div>
        </button>
        
        <button data-tab="consultas" class="tab-reporte px-6 py-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            Consultas Rápidas
          </div>
        </button>
      </nav>
    </div>

    <!-- Contenedor Principal -->
    <div class="p-6">
      <!-- Estado: Loading -->
      <div id="reporte-loading" class="hidden py-16 text-center">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-purple-600 mx-auto mb-4"></div>
        <p class="text-gray-500 text-lg font-semibold">Generando reporte...</p>
        <p class="text-gray-400 text-sm mt-2">Por favor espere</p>
      </div>

      <!-- Estado: Error -->
      <div id="reporte-error" class="hidden py-16 text-center">
        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <p class="text-xl font-bold text-gray-800 mb-2">Error al cargar reporte</p>
        <p class="text-gray-600" id="reporte-error-mensaje">Ocurrió un error inesperado</p>
      </div>

      <!-- Contenedor Dinámico -->
      <div id="reporte-content">
        <!-- Aquí se cargará el contenido específico de cada módulo -->
        <div class="py-16 text-center">
          <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <p class="text-lg font-semibold text-gray-700">Selecciona un tipo de reporte</p>
          <p class="text-sm text-gray-500 mt-2">Usa las pestañas superiores para elegir</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Estilos adicionales para las pestañas -->
<style>
.tab-reporte {
  position: relative;
  overflow: hidden;
}

.tab-reporte::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(to right, #9333ea, #ec4899);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.tab-reporte.active::after {
  transform: scaleX(1);
}

/* Responsive */
@media (max-width: 768px) {
  #tabs-reportes {
    justify-content: flex-start;
  }
  
  .tab-reporte {
    flex-shrink: 0;
  }
}
</style>
