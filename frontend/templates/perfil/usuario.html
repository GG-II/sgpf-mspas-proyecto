<!-- ===== PERFIL DE USUARIO MODERNIZADO ===== -->

<!-- Header Moderno con Gradiente -->
<div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl shadow-xl p-8 mb-6">
    <div class="flex items-center gap-4">
        <!-- Avatar -->
        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-full flex items-center justify-center backdrop-blur-sm">
            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
        </div>
        <div>
            <h2 class="text-3xl font-bold mb-1">Mi Perfil</h2>
            <p class="text-indigo-100 text-lg">Información personal y configuración de cuenta</p>
        </div>
    </div>
</div>

<!-- Información Personal -->
<div class="bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-200">
    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>
        </svg>
        Información Personal
    </h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Código de Empleado -->
        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">Código de Empleado</label>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                </svg>
                <p id="perfil-codigo" class="text-lg font-bold text-gray-900">-</p>
            </div>
        </div>
        
        <!-- DPI -->
        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">DPI</label>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>
                </svg>
                <p id="perfil-dpi" class="text-lg font-bold text-gray-900">-</p>
            </div>
        </div>
        
        <!-- Email -->
        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">Email</label>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <p id="perfil-email" class="text-lg font-semibold text-gray-900 break-all">-</p>
            </div>
        </div>
        
        <!-- Cargo -->
        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">Cargo</label>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <p id="perfil-cargo" class="text-lg font-bold text-gray-900">-</p>
            </div>
        </div>
        
        <!-- Rol -->
        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">Rol del Sistema</label>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                <span id="perfil-rol" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm font-semibold">-</span>
            </div>
        </div>
        
        <!-- Territorio (condicional) -->
        <div id="perfil-territorio-container" class="space-y-2 hidden">
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">Territorio Asignado</label>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <p id="perfil-territorio" class="text-lg font-bold text-gray-900">-</p>
            </div>
        </div>
    </div>
</div>

<!-- Editar Información -->
<div class="bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-200">
    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        Editar Información
    </h3>
    
    <form id="form-actualizar-perfil" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Nombres -->
            <div>
                <label for="edit-nombres" class="block text-sm font-semibold text-gray-700 mb-2">
                    Nombres <span class="text-red-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="edit-nombres" 
                    name="nombres" 
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                    placeholder="Ingresa tus nombres"
                >
            </div>
            
            <!-- Apellidos -->
            <div>
                <label for="edit-apellidos" class="block text-sm font-semibold text-gray-700 mb-2">
                    Apellidos <span class="text-red-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="edit-apellidos" 
                    name="apellidos" 
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                    placeholder="Ingresa tus apellidos"
                >
            </div>
        </div>
        
        <!-- Teléfono -->
        <div>
            <label for="edit-telefono" class="block text-sm font-semibold text-gray-700 mb-2">
                Teléfono
            </label>
            <input 
                type="tel" 
                id="edit-telefono" 
                name="telefono"
                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                placeholder="Ej: 7700-0000"
            >
        </div>
        
        <button 
            type="submit" 
            id="btn-actualizar-perfil"
            class="w-full px-6 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white font-semibold rounded-lg hover:from-green-700 hover:to-emerald-700 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
        >
            <span id="loading-actualizar" class="hidden">
                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Actualizar Información
        </button>
    </form>
</div>

<!-- Cambiar Contraseña -->
<div class="bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-200">
    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        Cambiar Contraseña
    </h3>
    
    <form id="form-cambiar-password" class="space-y-5">
        <!-- Contraseña Actual -->
        <div>
            <label for="password-actual" class="block text-sm font-semibold text-gray-700 mb-2">
                Contraseña Actual <span class="text-red-500">*</span>
            </label>
            <input 
                type="password" 
                id="password-actual" 
                name="password_actual" 
                required
                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
                placeholder="Ingresa tu contraseña actual"
            >
        </div>
        
        <!-- Nueva Contraseña -->
        <div>
            <label for="password-nueva" class="block text-sm font-semibold text-gray-700 mb-2">
                Nueva Contraseña <span class="text-red-500">*</span>
            </label>
            <input 
                type="password" 
                id="password-nueva" 
                name="password_nueva" 
                required 
                minlength="6"
                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
                placeholder="Mínimo 6 caracteres"
            >
            <p class="mt-2 text-sm text-gray-600">La contraseña debe tener al menos 6 caracteres</p>
        </div>
        
        <!-- Confirmar Contraseña -->
        <div>
            <label for="confirmar-password" class="block text-sm font-semibold text-gray-700 mb-2">
                Confirmar Nueva Contraseña <span class="text-red-500">*</span>
            </label>
            <input 
                type="password" 
                id="confirmar-password" 
                name="confirmar_password" 
                required
                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
                placeholder="Repite la nueva contraseña"
            >
        </div>
        
        <button 
            type="submit" 
            id="btn-cambiar-password"
            class="w-full px-6 py-3 bg-gradient-to-r from-orange-600 to-red-600 text-white font-semibold rounded-lg hover:from-orange-700 hover:to-red-700 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
        >
            <span id="loading-password" class="hidden">
                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
            </svg>
            Cambiar Contraseña
        </button>
    </form>
</div>

<!-- Comunidades Asignadas (Solo para auxiliares) -->
<div id="comunidades-container" class="bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-200 hidden">
    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Comunidades Asignadas
    </h3>
    <div id="lista-comunidades" class="space-y-3">
        <!-- Se llena dinámicamente -->
    </div>
</div>
