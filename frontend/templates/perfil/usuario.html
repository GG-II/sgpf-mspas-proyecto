<!-- ===== PERFIL DE USUARIO V3.2 - ESTILOS FORZADOS ===== -->

<div class="perfil-usuario-container">
  
  <!-- Header Azul Institucional -->
  <div class="perfil-header">
    <div class="header-content">
      <div class="header-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Mi Perfil</h1>
        <p>Información personal y configuración de cuenta</p>
      </div>
    </div>
  </div>

  <!-- Grid de 2 columnas en desktop -->
  <div class="perfil-grid">
    
    <!-- Columna Izquierda: Información Personal -->
    <div class="perfil-section">
      <div class="section-header">
        <h2>
          <svg class="section-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Información Personal
        </h2>
      </div>
      
      <div class="section-content">
        <!-- Código Empleado -->
        <div class="info-field">
          <label>Código de Empleado</label>
          <div class="info-value" id="perfil-codigo">-</div>
        </div>

        <!-- Email -->
        <div class="info-field">
          <label>Email</label>
          <div class="info-value" id="perfil-email">-</div>
        </div>

        <!-- DPI -->
        <div class="info-field">
          <label>DPI</label>
          <div class="info-value mono" id="perfil-dpi">-</div>
        </div>

        <!-- Cargo -->
        <div class="info-field">
          <label>Cargo</label>
          <div class="info-value" id="perfil-cargo">-</div>
        </div>

        <!-- Rol -->
        <div class="info-field">
          <label>Rol del Sistema</label>
          <div class="info-badge" id="perfil-rol">-</div>
        </div>

        <!-- Territorio (condicional) -->
        <div id="perfil-territorio-container" class="info-field hidden">
          <label>Territorio Asignado</label>
          <div class="info-value" id="perfil-territorio">-</div>
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Editar Información -->
    <div class="perfil-section">
      <div class="section-header">
        <h2>
          <svg class="section-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          Editar Información
        </h2>
      </div>
      
      <div class="section-content">
        <form id="form-actualizar-perfil">
          <!-- Nombres -->
          <div class="form-group">
            <label class="form-label required">Nombres</label>
            <input 
              type="text" 
              id="edit-nombres" 
              name="nombres" 
              required
              class="form-input-perfil"
              placeholder="Ingresa tus nombres"
            >
          </div>

          <!-- Apellidos -->
          <div class="form-group">
            <label class="form-label required">Apellidos</label>
            <input 
              type="text" 
              id="edit-apellidos" 
              name="apellidos" 
              required
              class="form-input-perfil"
              placeholder="Ingresa tus apellidos"
            >
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input 
              type="tel" 
              id="edit-telefono" 
              name="telefono"
              class="form-input-perfil"
              placeholder="Ej: 7700-0000"
            >
          </div>

          <!-- Botón Actualizar -->
          <button 
            type="submit" 
            id="btn-actualizar-perfil"
            class="btn-primary btn-full"
          >
            <span id="loading-actualizar" class="hidden">
              <svg class="loading-spinner" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Actualizar Información
          </button>
        </form>
      </div>
    </div>

  </div>

  <!-- Fila completa: Cambiar Contraseña -->
  <div class="perfil-section">
    <div class="section-header">
      <h2>
        <svg class="section-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        Cambiar Contraseña
      </h2>
    </div>
    
    <div class="section-content">
      <form id="form-cambiar-password" class="password-form">
        <!-- Contraseña Actual -->
        <div class="form-group">
          <label class="form-label required">Contraseña Actual</label>
          <input 
            type="password" 
            id="password-actual" 
            name="password_actual" 
            required
            class="form-input-perfil"
            placeholder="Ingresa tu contraseña actual"
          >
        </div>

        <!-- Nueva Contraseña -->
        <div class="form-group">
          <label class="form-label required">Nueva Contraseña</label>
          <input 
            type="password" 
            id="password-nueva" 
            name="password_nueva" 
            required 
            minlength="6"
            class="form-input-perfil"
            placeholder="Mínimo 6 caracteres"
          >
          <p class="input-help">La contraseña debe tener al menos 6 caracteres</p>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="form-group">
          <label class="form-label required">Confirmar Nueva Contraseña</label>
          <input 
            type="password" 
            id="confirmar-password" 
            name="confirmar_password" 
            required
            class="form-input-perfil"
            placeholder="Repite la nueva contraseña"
          >
        </div>

        <!-- Botón Cambiar -->
        <button 
          type="submit" 
          id="btn-cambiar-password"
          class="btn-warning btn-full"
        >
          <span id="loading-password" class="hidden">
            <svg class="loading-spinner" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
          Cambiar Contraseña
        </button>
      </form>
    </div>
  </div>

  <!-- Comunidades Asignadas (Solo auxiliares) -->
  <div id="comunidades-container" class="perfil-section hidden">
    <div class="section-header">
      <h2>
        <svg class="section-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Comunidades Asignadas
      </h2>
    </div>
    <div class="section-content">
      <div id="lista-comunidades" class="comunidades-grid">
        <!-- Se llena dinámicamente -->
      </div>
    </div>
  </div>

</div>

<!-- Estilos CSS CON !IMPORTANT PARA SOBRESCRIBIR -->
<style>

}

  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 2px 8px rgba(0, 102, 204, 0.15);

.perfil-header .header-content {
  display: flex;
  align-items: center;
  gap: 0.75rem !important;
}

  background: rgba(255, 255, 255, 0.2) !important;
  border-radius: 50%;
  display: flex;
  align-items: center;

  backdrop-filter: blur(10px);
  flex-shrink: 0;
}

.perfil-header .header-icon svg {

  height: 2rem;
  color: #FFFFFF !important;
  stroke: #FFFFFF !important;
}

  font-size: 1.5rem;

}

.perfil-grid {
  display: grid;

.section-icon {

}

  padding: 1.5rem;
}

/* === INFO FIELDS === */
.info-field {
  margin-bottom: 1.25rem;
}

.info-field:last-child {

}

.info-field label {

.btn-warning {

.btn-primary {

.btn-primary:hover {

.btn-warning {
  background: #F59E0B;
  color: white;
}

.btn-warning:hover {

  transform: translateY(-1px);

.btn-icon {
  width: 1.25rem;

}

.comunidades-grid {

  gap: 0.75rem;
}

/* === UTILITIES === */
.hidden {
  display: none !important;
}

/* === RESPONSIVE TABLET === */
@media (min-width: 640px) {
  .password-form {
    grid-template-columns: repeat(2, 1fr);
  }

  .password-form .form-group:last-of-type,
  .password-form button {
    grid-column: 1 / -1;
  }

  .comunidades-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* === RESPONSIVE DESKTOP === */
@media (min-width: 768px) {
  .perfil-header {
    padding: 2rem;
  }

  .perfil-header .header-text h1 {
    font-size: 1.75rem;
  }

  .perfil-header .header-icon {
    width: 5rem;
    height: 5rem;
  }

  .perfil-header .header-icon svg {
    width: 2.5rem;
    height: 2.5rem;
  }

  /* ✅ GRID 2 COLUMNAS EN DESKTOP */
  .perfil-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .section-content {
    padding: 2rem;
  }

  .password-form {
    grid-template-columns: repeat(3, 1fr);
  }

  .comunidades-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 1024px) {
  .password-form {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
