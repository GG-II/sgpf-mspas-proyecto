<!-- ===== DASHBOARD AUXILIAR V2.1 - OPTIMIZADO CON 4 MÉTRICAS ===== -->

<div class="max-w-4xl mx-auto p-4 space-y-6">
  
  <!-- Header Simple -->
  <div class="bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl p-6 text-white shadow-lg">
    <h1 class="text-2xl font-bold">👋 Hola, <span id="auxiliar-nombre">Cargando...</span></h1>
    <p class="text-blue-100 mt-1" id="auxiliar-comunidad">Comunidad: Cargando...</p>
  </div>

  <!-- 4 Métricas Principales: Total + 3 Tipos -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- NUEVA: Total Usuarias -->
    <div class="bg-white rounded-lg p-4 text-center shadow-md hover:shadow-lg transition">
      <div class="text-4xl font-bold text-indigo-600" id="total-usuarias">0</div>
      <div class="text-sm text-gray-600 mt-2">Total Usuarias</div>
      <div class="text-xs text-gray-400 mt-1">Este mes</div>
    </div>
    
    <div class="bg-white rounded-lg p-4 text-center shadow-md hover:shadow-lg transition">
      <div class="text-4xl font-bold text-green-600" id="usuarias-nuevas">0</div>
      <div class="text-sm text-gray-600 mt-2">Nuevas</div>
      <div class="text-xs text-gray-400 mt-1">Este mes</div>
    </div>
    
    <div class="bg-white rounded-lg p-4 text-center shadow-md hover:shadow-lg transition">
      <div class="text-4xl font-bold text-blue-600" id="usuarias-reconsulta">0</div>
      <div class="text-sm text-gray-600 mt-2">Reconsulta</div>
      <div class="text-xs text-gray-400 mt-1">Este mes</div>
    </div>
    
    <div class="bg-white rounded-lg p-4 text-center shadow-md hover:shadow-lg transition">
      <div class="text-4xl font-bold text-purple-600" id="usuarias-activas">0</div>
      <div class="text-sm text-gray-600 mt-2">Activas</div>
      <div class="text-xs text-gray-400 mt-1">Este mes</div>
    </div>
  </div>

  <!-- Acción Principal -->
  <button 
    onclick="ComponentLoader.navigateToView('registro')" 
    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:scale-[1.02] active:scale-[0.98]">
    <span class="text-xl">📝</span> Registrar Nueva Visita
  </button>

  <!-- Últimas 5 Visitas -->
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="px-6 py-4 border-b bg-gray-50">
      <h2 class="font-semibold text-gray-800 flex items-center gap-2">
        <span class="text-xl">📋</span>
        Mis Últimas Visitas
      </h2>
    </div>
    
    <div id="ultimas-visitas" class="divide-y">
      <!-- Loading state -->
      <div class="px-6 py-8 text-center text-gray-400">
        <div class="animate-pulse">Cargando visitas...</div>
      </div>
    </div>
    
    <!-- Sin visitas -->
    <div id="sin-visitas" class="hidden px-6 py-8 text-center text-gray-400">
      <div class="text-4xl mb-2">🔭</div>
      <p>Aún no has registrado visitas este mes</p>
    </div>
  </div>

  <!-- Info Comunidad (Colapsable) -->
  <details class="bg-white rounded-lg shadow-md overflow-hidden">
    <summary class="px-6 py-4 cursor-pointer hover:bg-gray-50 transition font-semibold text-gray-700 flex items-center justify-between">
      <span class="flex items-center gap-2">
        <span class="text-xl">🏘️</span>
        Mi Comunidad
      </span>
      <span class="text-gray-400">▼</span>
    </summary>
    
    <div class="px-6 py-4 border-t bg-gray-50" id="info-comunidad">
      <div class="animate-pulse text-gray-400">Cargando información...</div>
    </div>
  </details>

</div>

<!-- Script de inicialización -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Delay para asegurar que el DOM esté listo
    setTimeout(() => {
        if (typeof window.AuxiliarDashboard !== 'undefined') {
            window.AuxiliarDashboard.init();
        } else {
            console.error('❌ AuxiliarDashboard no está definido');
        }
    }, 300);
});
</script>
