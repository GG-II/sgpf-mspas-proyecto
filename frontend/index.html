<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- JavaScript Modular -->
    <!-- JavaScript Modular con Cache Busting -->
<script>
    // Generar timestamp único para cada recarga (Cache Busting)
    const cacheBuster = new Date().getTime();
    
    // Función para cargar scripts sin caché
    function loadScript(src) {
        const script = document.createElement('script');
        script.src = `${src}?v=${cacheBuster}`;
        script.async = false; // Cargar en orden
        document.head.appendChild(script);
        return new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = reject;
        });
    }
    
    // Lista de scripts en orden
    const scripts = [
        'js/config.js',
        'js/shared.js',
        'js/security.js',
        'js/component-loader.js',
        'js/auth.js',
        'js/app.js'
    ];
    
    // Cargar scripts secuencialmente
    console.log('🔄 Cargando scripts con cache busting:', cacheBuster);
    
    (async () => {
        for (const script of scripts) {
            try {
                await loadScript(script);
                console.log(`✅ Cargado: ${script}?v=${cacheBuster}`);
            } catch (error) {
                console.error(`❌ Error cargando ${script}:`, error);
            }
        }
        
        // Verificar que SGPFConfig esté disponible
        if (typeof SGPFConfig !== 'undefined') {
            console.log('✅ SGPFConfig cargado correctamente');
            SGPFConfig.logConfig();
        } else {
            console.error('❌ SGPFConfig NO se cargó');
        }
    })();
</script>

<!-- Meta tags anti-caché -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // Asegurar que jsPDF esté disponible globalmente
      if (typeof window.jspdf !== 'undefined' && window.jspdf.jsPDF) {
        window.jsPDF = window.jspdf;
      }
    </script>
    <!-- jsPDF AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Configuración Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f5f7ff",
                100: "#ebf0ff",
                200: "#d6e0ff",
                300: "#a3b9ff",
                400: "#6b8eff",
                500: "#4169e1",

                700: "#2a3f8f",
                800: "#1f2d66",
                900: "#141d3d",
              },
            },
          },
        },
      };
    </script>

    <!-- Librerías -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <title>SGPF - MSPAS Huehuetenango</title>

    <!-- CSS Modular -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboards.css" />

    <style>
      /* === VARIABLES === */
      :root {
        --header-height: 64px;
        --nav-desktop-height: 56px;
        --nav-mobile-height: 64px;
      }

      /* === ESTRUCTURA PRINCIPAL === */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #4c51bf 0%, #5a3d7a 100%);
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .app-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* === HEADER - SIEMPRE SOLIDO === */
      .app-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        height: var(--header-height);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .header-content {
        max-width: 100%;
        height: 100%;
        padding: 0 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-logo {
        height: 40px;
        width: auto;
        filter: brightness(0) invert(1);
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 1rem;
        color: white;
      }

      #user-name {
        display: none;
        font-weight: 600;
        font-size: 0.875rem;
      }

      .btn-logout {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.875rem;
      }

      .btn-logout:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }

      /* === NAVEGACION DESKTOP (arriba) === */
      .desktop-nav {
        display: none;
        background: white;
        height: var(--nav-desktop-height);
        position: fixed;
        top: var(--header-height);
        left: 0;
        right: 0;
        z-index: 900;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border-bottom: 1px solid #e5e7eb;
      }

      .desktop-nav-content {
        max-width: 1400px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        gap: 0.25rem;
      }

      .desktop-nav .nav-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        color: #6b7280;
        font-weight: 500;
        font-size: 0.875rem;
        white-space: nowrap;
      }

      .desktop-nav .nav-item:hover {
        background: #f3f4f6;
        color: #667eea;
      }

      .desktop-nav .nav-item.active {
        background: #667eea;
        color: white;
      }

      .desktop-nav .nav-icon {
        font-size: 1.25rem;
      }

      .desktop-nav .nav-label {
        font-size: 0.875rem;
      }

      /* === NAVEGACION MOVIL (abajo) === */
      .mobile-nav {
        display: flex;
        background: white;
        height: var(--nav-mobile-height);
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 900;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        border-top: 1px solid #e5e7eb;
      }

      .mobile-nav .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        color: #6b7280;
        position: relative;
      }

      .mobile-nav .nav-item:active {
        transform: scale(0.95);
      }

      .mobile-nav .nav-item.active {
        color: #667eea;
      }

      .mobile-nav .nav-item.active::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: #667eea;
        border-radius: 0 0 3px 3px;
      }

      .mobile-nav .nav-icon {
        font-size: 1.5rem;
      }

      .mobile-nav .nav-label {
        font-size: 0.75rem;
        font-weight: 600;
      }

      /* === CONTENIDO PRINCIPAL === */
      .main-content {
        flex: 1;
        margin-top: var(--header-height);
        padding: 1.5rem 1rem;
        padding-bottom: calc(var(--nav-mobile-height) + 1.5rem);
        max-width: 1400px;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
      }

      /* === LOADING === */
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(102, 126, 234, 0.95);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        flex-direction: column;
        gap: 1.5rem;
      }

      .loading-overlay:not(.hidden) {
        display: flex;
      }

      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-overlay p {
        color: white;
        font-size: 1.125rem;
        font-weight: 600;
      }

      /* === TOAST === */
      .toast-container {
        position: fixed;
        top: calc(var(--header-height) + 1rem);
        right: 1rem;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      /* === MODALES - Z-INDEX ALTO === */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 9000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow-y: auto;
      }

      .modal-content {
        background: white;
        border-radius: 0.75rem;
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        position: relative;
        z-index: 9001;
      }

      /* === RESPONSIVE DESKTOP === */
      @media (min-width: 768px) {
        #user-name {
          display: inline;
        }

        .btn-logout {
          padding: 0.5rem 1.5rem;
        }

        .desktop-nav {
          display: block;
        }

        .mobile-nav {
          display: none;
        }

        .main-content {
          margin-top: calc(var(--header-height) + var(--nav-desktop-height));
          padding: 2rem;
          padding-bottom: 2rem;
        }

        .toast-container {
          top: calc(var(--header-height) + var(--nav-desktop-height) + 1rem);
        }
      }

      @media (min-width: 1024px) {
        .main-content {
          padding: 2.5rem 3rem;
        }
      }

      /* === INITIAL LOADING === */
      #initial-loading {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        padding: 3rem 2rem;
        border-radius: 1rem;
        text-align: center;
        margin: 2rem auto;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }

      #initial-loading h2 {
        font-size: 1.875rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      #initial-loading p {
        color: #6b7280;
      }

      .pulse-dot {
        width: 16px;
        height: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 50%;
        margin: 1rem auto;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.2);
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- HEADER FIJO -->
      <header id="app-header" class="app-header hidden">
        <div class="header-content">
          <img
            src="assets/images/logo-mspas-2.png"
            alt="MSPAS"
            class="header-logo"
          />
          <div class="user-info">
            <span id="user-name">Cargando...</span>
            <button id="logout-btn" class="btn-logout">Salir</button>
          </div>
        </div>
      </header>

      <!-- NAVEGACION DESKTOP (arriba, estilo Office) -->
      <nav id="desktop-nav" class="desktop-nav hidden">
        <div class="desktop-nav-content">
          <!-- Se genera dinamicamente -->
        </div>
      </nav>

      <!-- CONTENIDO PRINCIPAL -->
      <main id="main-content" class="main-content">
        <div id="initial-loading">
          <div class="pulse-dot"></div>
          <h2>🏥 Cargando Sistema</h2>
          <p>Preparando tu espacio de trabajo...</p>
        </div>
      </main>

      <!-- NAVEGACION MOVIL (abajo, estilo YouTube/X) -->
      <nav id="mobile-nav" class="mobile-nav hidden">
        <!-- Se genera dinamicamente -->
      </nav>

      <!-- LOADING OVERLAY -->
      <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>Cargando...</p>
      </div>

      <!-- TOAST CONTAINER -->
      <div id="toast-container" class="toast-container"></div>
    </div>

    <script>
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        window.SGPF_DEBUG = true;
      }

      document.addEventListener("DOMContentLoaded", () => {
        console.log("🌟 DOM cargado, inicializando SGPF App");
        setTimeout(() => SGPFApp.init(), 100);
      });

      window.addEventListener("error", (event) => {
        console.error("❌ Error JavaScript global:", event.message);
        if (window.SGPF_DEBUG) {
          alert(
            `Error: ${event.message}\nArchivo: ${event.filename}\nLínea: ${event.lineno}`
          );
        }
      });
    </script>
  </body>
</html>
