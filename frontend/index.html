<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS CDN (PRIMERO) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <title>SGPF - MSPAS Huehuetenango</title>
    
    <!-- CSS Modular (después de Tailwind) -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/dashboards.css">
    
    <!-- Meta tags para PWA -->
    <meta name="description" content="Sistema de Gestión de Planificación Familiar - MSPAS Huehuetenango">
    <meta name="theme-color" content="#6366F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        /* Estilos adicionales para mejorar la apariencia */
        .app-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .main-content {
            min-height: calc(100vh - 120px);
            background: #f8f9fa;
            padding-bottom: 80px; /* Espacio para nav móvil */
        }
        
        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-logo {
            height: 40px;
            width: auto;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: white;
        }
        
        #user-name {
            font-weight: 600;
            display: none;
        }
        
        @media (min-width: 640px) {
            #user-name {
                display: inline;
            }
        }
        
        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 50;
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 1rem;
        }
        
        .loading-overlay:not(.hidden) {
            display: flex;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-overlay p {
            color: white;
            font-size: 1.125rem;
            font-weight: 600;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Mejoras visuales para el contenido principal */
        #main-content {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #initial-loading {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 1.5rem;
            border-radius: 1rem;
            text-align: center;
            margin: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        #initial-loading h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        #initial-loading p {
            font-size: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="app-container">
        <!-- Header dinámico -->
        <header id="app-header" class="app-header hidden">
            <div class="header-content">
                <img src="assets/images/logo-mspas-2.png" alt="MSPAS" id="header-logo" class="header-logo">
                <div class="user-info">
                    <span id="user-name">Cargando...</span>
                    <button id="logout-btn" class="btn-logout">Salir</button>
                </div>
            </div>
        </header>

        <!-- Contenedor principal donde se cargan los templates -->
        <main id="main-content" class="main-content">
            <!-- Vista inicial mientras carga -->
            <div id="initial-loading" class="max-w-2xl mx-auto mt-20">
                <div class="animate-pulse mb-4">
                    <div class="w-16 h-16 bg-white bg-opacity-30 rounded-full mx-auto mb-4"></div>
                </div>
                <h2>🏥 Cargando Sistema</h2>
                <p>Preparando tu espacio de trabajo...</p>
            </div>
        </main>

        <!-- Navegación móvil dinámica -->
        <nav id="mobile-nav" class="mobile-nav hidden">
            <!-- Los tabs se generan dinámicamente según el rol del usuario -->
        </nav>

        <!-- Loading overlay global -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Cargando...</p>
        </div>

        <!-- Container para notificaciones toast -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- JavaScript Modular - Orden importante -->
    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Inicialización de la aplicación -->
    <script>
        // Configuración global para debugging en desarrollo
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            window.SGPF_DEBUG = true;
            console.log('🔧 Modo debug activado');
        }
        
        // Inicialización principal
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🌟 DOM cargado, inicializando SGPF App');
            
            // Pequeño delay para evitar condiciones de carrera
            setTimeout(() => {
                SGPFApp.init();
            }, 100);
        });
        
        // Manejar errores JavaScript globales
        window.addEventListener('error', (event) => {
            console.error('❌ Error JavaScript global:', {
                message: event.message,
                filename: event.filename,
                lineno: event.lineno,
                colno: event.colno
            });
            
            // Mostrar error al usuario solo en desarrollo
            if (window.SGPF_DEBUG) {
                alert(`Error: ${event.message}\nArchivo: ${event.filename}\nLínea: ${event.lineno}`);
            }
        });
        
        // Manejar promesas rechazadas
        window.addEventListener('unhandledrejection', (event) => {
            console.error('❌ Promesa rechazada:', event.reason);
            
            if (window.SGPF_DEBUG) {
                alert(`Promise rechazada: ${event.reason}`);
            }
        });
    </script>
    <script src="js/navigation-fix.js"></script>
    <script src="js/counter-emergency-fix.js"></script>
</body>
</html>
